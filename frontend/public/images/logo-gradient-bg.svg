<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <clipPath id="iconClip">
      <rect x="0" y="0" width="120" height="120" rx="28"/>
    </clipPath>
  </defs>
  <!-- Background -->
  <rect x="0" y="0" width="120" height="120" rx="28" fill="url(#iconGrad)"/>
  <!-- Shine -->
  <ellipse cx="28" cy="22" rx="30" ry="20" fill="white" fill-opacity="0.18" clip-path="url(#iconClip)"/>
  <!-- ذ letter -->
  <text x="60" y="80" text-anchor="middle" font-family="'Segoe UI', 'Arial', sans-serif" font-size="64" font-weight="500" fill="white">ذ</text>
</svg>

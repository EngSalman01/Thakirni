<svg width="280" height="64" viewBox="0 0 280 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e47b8"/>
      <stop offset="55%" stop-color="#5b35d5"/>
      <stop offset="100%" stop-color="#b8185d"/>
    </linearGradient>
    <clipPath id="c">
      <rect x="4" y="6" width="52" height="52" rx="15"/>
    </clipPath>
  </defs>

  <!-- Icon squircle -->
  <rect x="4" y="6" width="52" height="52" rx="15" fill="url(#g)"/>
  <!-- Corner arc highlight (top-right) -->
  <circle cx="56" cy="6" r="26" fill="white" fill-opacity="0.16" clip-path="url(#c)"/>

  <!-- 4-pointed star — center (30,32), outer r=12, inner r=5 -->
  <path d="M30,20 L33.5,28.5 L42,32 L33.5,35.5 L30,44 L26.5,35.5 L18,32 L26.5,28.5 Z"
        fill="white" fill-opacity="0.96"/>

  <!-- Wordmark -->
  <text x="70" y="34"
        font-family="'Inter', -apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-size="22" font-weight="700" letter-spacing="-0.6"
        fill="#0f172a">Thakirni</text>

  <!-- Arabic subtitle -->
  <text x="71" y="50"
        font-family="'SF Arabic', 'Geeza Pro', 'Segoe UI', Arial, sans-serif"
        font-size="13" font-weight="400" letter-spacing="0.2"
        fill="#94a3b8">ذكرني</text>
</svg>

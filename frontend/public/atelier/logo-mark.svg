<?xml version="1.0" encoding="UTF-8"?>
<!--
  Thakirni — Atelier mark
  A flame-as-memory glyph: two concentric arcs holding a small ember.
  Colors reference the atelier palette (ember on obsidian).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Thakirni mark">
  <defs>
    <linearGradient id="thk-ember" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF5113"/>
      <stop offset="1" stop-color="#C7350A"/>
    </linearGradient>
    <radialGradient id="thk-glow" cx="0.5" cy="0.7" r="0.6">
      <stop offset="0" stop-color="#FF5113" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FF5113" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Outer warm glow -->
  <circle cx="32" cy="36" r="20" fill="url(#thk-glow)"/>

  <!-- Outer arc — the vessel -->
  <path
    d="M16 40 C16 23, 48 23, 48 40"
    fill="none"
    stroke="#F1EADE"
    stroke-width="1.5"
    stroke-linecap="round"
    opacity="0.9"
  />
  <!-- Inner arc — memory, slightly smaller and inverted -->
  <path
    d="M22 42 C22 31, 42 31, 42 42"
    fill="none"
    stroke="#F1EADE"
    stroke-width="1.2"
    stroke-linecap="round"
    opacity="0.55"
  />

  <!-- Ember flame — the core -->
  <path
    d="M32 18
       C 34.5 22, 36 25, 36 29
       C 36 32, 34 33.5, 32 33.5
       C 30 33.5, 28 32, 28 29
       C 28 25, 29.5 22, 32 18 Z"
    fill="url(#thk-ember)"
  />
  <!-- Highlight on flame -->
  <path
    d="M32 21.5
       C 33 24, 33.6 26, 33.6 28.2
       C 33.6 29.8, 32.9 30.7, 32 30.7"
    fill="none"
    stroke="#FFFFFF"
    stroke-opacity="0.55"
    stroke-width="0.8"
    stroke-linecap="round"
  />

  <!-- Baseline dot — the anchor -->
  <circle cx="32" cy="44" r="1.4" fill="#FF5113"/>
</svg>
